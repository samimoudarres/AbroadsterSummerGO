<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Abroadster trip invite</title>
    <meta
      name="description"
      content="Join a trip on Abroadster — the study-abroad social map."
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #175864;
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        opacity: 0.9;
        line-height: 1.45;
        margin: 0 0 20px;
      }
      a.btn {
        display: inline-block;
        background: #fff;
        color: #175864;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 22px;
        border-radius: 12px;
      }
      .sub {
        margin-top: 16px;
        font-size: 13px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening Abroadster…</h1>
      <p>
        If the app doesn’t open automatically, tap below to join the trip — or
        download Abroadster from the App Store.
      </p>
      <a class="btn" id="open" href="#">Open invite</a>
      <p class="sub">
        <a id="store" href="https://apps.apple.com/app/id6800081262" style="color:#fff"
          >Get Abroadster on the App Store</a
        >
      </p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var token = params.get('t') || '';
        var deep = token ? 'abroadster://trip/' + encodeURIComponent(token) : 'abroadster://';
        var store = 'https://apps.apple.com/app/id6800081262';
        var openBtn = document.getElementById('open');
        openBtn.setAttribute('href', deep);
        document.getElementById('store').setAttribute('href', store);

        // Try to open the app immediately
        window.location.href = deep;

        // If still here, send to the App Store
        setTimeout(function () {
          window.location.href = store;
        }, 1800);
      })();
    </script>
  </body>
</html>
